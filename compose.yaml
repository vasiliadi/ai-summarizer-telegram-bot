services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - path: ./.env
        required: true

  ai-summarizer-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot
    env_file:
      - path: ./.env
        required: true
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
