services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    # Only what the deploy steps need. Compose interpolates them from ./.env, and a variable
    # exported in the shell wins over .env; the bot takes DSN the same way, so both hit one DB.
    environment:
      DSN: ${DSN:?DSN is not set in .env}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:?MODAL_TOKEN_ID is not set in .env}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:?MODAL_TOKEN_SECRET is not set in .env}

  ai-summarizer-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot
    env_file:
      - path: ./.env
        required: true
    # Overrides env_file's DSN so the bot uses the database migrate just migrated.
    environment:
      DSN: ${DSN:?DSN is not set in .env}
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
