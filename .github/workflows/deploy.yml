name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two migration runs must never overlap; a queued run waits instead of cancelling one mid-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy-cron:
    name: Migrate database and deploy Modal cron
    runs-on: ubuntu-latest
    env:
      ENV: BUILD
      MODAL_BUILD_VALIDATION: ignore
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          enable-cache: "auto"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen --only-group build

      - name: Create users table
        run: uv run --no-sync python scripts/db.py
        env:
          DSN: ${{ secrets.DSN }}

      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head
        env:
          DSN: ${{ secrets.DSN }}

      - name: Deploy Modal cron
        run: uv run --no-sync modal deploy scripts/cron.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
