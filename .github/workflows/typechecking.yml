name: Type checking

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  typechecking:
    name: Type checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: "auto"
          cache-python: true

      - name: Install dependencies
        run: uv sync

      - name: Run ty check
        run: uvx ty@latest check src/
