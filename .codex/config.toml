web_search = "live"

# Mirrors the PreToolUse hook in .claude/settings.json: block edits to tracked repo
# files while the checkout is on main. Gitignored files stay exempt.
[[hooks.PreToolUse]]
matcher = "^apply_patch$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/branch_guard.py"'
timeout = 10
statusMessage = "Checking protected branch"
